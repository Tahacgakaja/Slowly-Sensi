name: Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "ZIP nao encontrado"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -name settings.gradle -type f | head -n 1)
          test -n "$SETTINGS" || { echo "Projeto Gradle nao encontrado"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SlowlyBypass-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
